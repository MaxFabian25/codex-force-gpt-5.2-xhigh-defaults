name: 🎁 Feature Request
description: Propose a new feature for this fork
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Is Codex missing a feature that you'd like to see? Feel free to propose it here.

        Before you submit a feature:
        1. Search existing issues for similar features. If you find one, 👍 it rather than opening a new one.
        2. This fork intentionally keeps a narrow scope. Requests that are not about fork defaults, release packaging, or small maintainable deltas from upstream may be declined. See [Contributing](https://github.com/MaxFabian25/codex-force-gpt-5.4-xhigh-defaults/blob/codex-force-gpt-5.4-xhigh-defaults/docs/contributing.md) for more details.

  - type: input
    id: variant
    attributes:
      label: What variant of Codex are you using?
      description: (e.g., Fork CLI from source, fork GitHub release, upstream CLI for comparison)
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
